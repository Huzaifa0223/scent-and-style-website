{% load static %}<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}{{ store_settings.name }}{% endblock %}</title>
    <meta name="description" content="{% block meta_description %}{% endblock %}" />
    <link rel="stylesheet" href="{% static 'css/app.css' %}" />
    {% block extra_head %}{% endblock %}
  </head>
  <body class="h-full bg-paper font-sans text-base text-ink antialiased">
    <a
      href="#main-content"
      class="sr-only rounded focus:not-sr-only focus:absolute focus:z-50 focus:m-2
             focus:bg-accent focus:px-4 focus:py-2 focus:text-white focus:outline-none
             focus:ring-2 focus:ring-accent focus:ring-offset-2 focus:ring-offset-paper"
    >
      Skip to content
    </a>

    {% if messages %}
      <ul
        id="messages"
        role="status"
        aria-live="polite"
        class="fixed inset-x-0 top-0 z-50 space-y-2 p-4"
      >
        {% for message in messages %}
          <li
            x-data="{ shown: true }"
            x-show="shown"
            class="flex items-start gap-3 rounded shadow-card px-4 py-3 text-sm font-medium
                   {% if message.tags == 'error' %}bg-danger text-white
                   {% elif message.tags == 'success' %}bg-success text-white
                   {% else %}bg-surface-sunken text-text-inverse{% endif %}"
          >
            <span class="flex-1">{{ message }}</span>
            <button
              type="button"
              @click="shown = false"
              class="shrink-0 rounded font-semibold leading-none opacity-80 hover:opacity-100
                     focus:outline-none focus-visible:ring-2 focus-visible:ring-white"
              aria-label="Dismiss"
            >
              &times;
            </button>
          </li>
        {% endfor %}
      </ul>
    {% endif %}

    {% block body %}{% endblock %}

    <script src="{% static 'vendor/htmx.min.js' %}" defer></script>
    <script src="{% static 'vendor/alpine.min.js' %}" defer></script>
    {% block extra_body %}{% endblock %}
  </body>
</html>
