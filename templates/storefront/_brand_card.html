<a
  href="{% url 'storefront:product_list' %}?brand={{ brand.slug|urlencode }}"
  aria-label="Shop {{ brand.name }} products"
  class="group relative flex aspect-square items-center justify-center overflow-hidden rounded-ajmal-card border border-ajmal-gold/50 bg-ajmal-cream text-center shadow-ajmal-lift transition duration-300 ease-ajmal-ease hover:-translate-y-1 hover:border-ajmal-gold hover:shadow-ajmal-float focus:outline-none focus-visible:ring-2 focus-visible:ring-ajmal-gold"
>
  {% if brand.logo %}
    <img src="{{ brand.logo.url }}" alt="{{ brand.name }}" width="400" height="400" loading="lazy" class="h-full w-full object-contain p-2 transition-transform duration-300 ease-ajmal-ease group-hover:scale-105 sm:p-3" />
  {% else %}
    <span class="font-gambetta text-sf-d-sm italic text-ajmal-ink">{{ brand.name }}</span>
  {% endif %}
  <span aria-hidden="true" class="absolute inset-0 flex items-center justify-center bg-ajmal-ink/85 px-2 text-ajmal-cream opacity-0 transition-opacity duration-200 ease-ajmal-ease group-hover:opacity-100 group-focus-visible:opacity-100">
    <span class="flex max-w-full flex-col items-center gap-2">
      <span class="h-px w-8 bg-ajmal-gold"></span>
      <span class="font-gambetta text-sf-sm italic">{{ brand.name }}</span>
      <span class="h-px w-8 bg-ajmal-gold"></span>
    </span>
  </span>
</a>
