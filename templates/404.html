{% load static %}<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found</title>
    <link rel="stylesheet" href="{% static 'css/app.css' %}?v={{ static_asset_version }}" />
  </head>
  <body class="flex h-full flex-col items-center justify-center gap-4 bg-paper px-4 text-center font-sans">
    <p class="text-sm font-semibold uppercase tracking-wide text-text-muted">404</p>
    <h1 class="text-2xl font-semibold text-ink">We couldn't find that page</h1>
    <p class="max-w-sm text-text-muted">
      The link may be out of date, or the page may have moved. Head back to the homepage to
      keep browsing.
    </p>
    <a
      href="/"
      class="mt-2 inline-flex min-h-11 items-center justify-center rounded bg-accent px-5 text-sm
             font-semibold text-white hover:bg-accent-hover focus:outline-none focus-visible:ring-2
             focus-visible:ring-accent focus-visible:ring-offset-2 focus-visible:ring-offset-paper"
    >
      Back to the store
    </a>
  </body>
</html>
