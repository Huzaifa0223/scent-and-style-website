{% load static %}<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found</title>
    <link rel="stylesheet" href="{% static 'css/app.css' %}" />
  </head>
  <body class="flex h-full flex-col items-center justify-center gap-4 bg-white px-4 text-center">
    <p class="text-sm font-semibold uppercase tracking-wide text-slate-500">404</p>
    <h1 class="text-2xl font-bold text-slate-900">We couldn't find that page</h1>
    <p class="max-w-sm text-slate-600">
      The link may be out of date, or the page may have moved. Head back to the homepage to
      keep browsing.
    </p>
    <a
      href="/"
      class="mt-2 min-h-[44px] rounded-md bg-slate-900 px-5 py-3 text-sm font-medium text-white
             hover:bg-slate-700"
    >
      Back to the store
    </a>
  </body>
</html>
