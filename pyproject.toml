[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["migrations", ".venv", "tools", "static/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN", "RUF"]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*.py" = ["ANN", "RUF012"]
"**/tests/**.py" = ["ANN"]
"**/test_*.py" = ["ANN"]
"conftest.py" = ["ANN"]
"**/factories.py" = ["ANN"]
# Django Meta inner classes (constraints/indexes lists) and *args/**kwargs
# overrides of save()/delete() must match Django's own Any-typed signature —
# both trip rules that assume plain application code, not framework overrides.
"**/models.py" = ["RUF012", "ANN401"]
# "*forms.py" (not just "forms.py") also covers portal/product_forms.py —
# same Meta.fields / __init__(*args, **kwargs) idiom, split into its own
# module because the variant formset logic is substantial (Stage 3; see
# specs/state.md).
"**/*forms.py" = ["RUF012", "ANN401"]
# Django CBV overrides (get_context_data(self, **kwargs), get_form_kwargs,
# ...), a signal receiver's **kwargs, and a form's __init__(*args, **kwargs)
# passthrough must all match Django's own Any-typed signatures — same
# reasoning as the models.py override above, just for the view/app-config/
# form-adjacent files in portal/ and accounts/ rather than models.py.
# get_queryset/get_object are typed properly instead (QuerySet[Model]), not
# covered by this ignore — only **kwargs-forwarding overrides are. If a
# fifth pattern is ever needed, record why in specs/state.md rather than
# just appending it here.
"{portal,accounts}/{views,*_views,apps}.py" = ["ANN401"]
# Fifth pattern (see the note above): a management command's handle(*args,
# **options) must match Django's own BaseCommand signature, same reasoning
# as the CBV/form overrides above. Generic across apps (not just inventory)
# since Stage 13's backup job will be another one. Recorded in
# specs/state.md's Stage 4 notes per this section's own instruction.
"**/management/commands/*.py" = ["ANN401"]
"config/settings/*.py" = ["F403", "F405"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["mypy_django_plugin.main"]
mypy_path = "."
exclude = ["migrations/", "tools/", "\\.venv/"]

[[tool.mypy.overrides]]
module = "*.migrations.*"
ignore_errors = true

[[tool.mypy.overrides]]
# pytest-django's injected fixtures (client, rf, django_user_model, ...) have
# no precise stubs; strict annotation requirements on test code add noise
# without catching real bugs. Tests still must pass — this only relaxes
# typing rigor, matching the same per-file-ignores choice in [tool.ruff].
module = ["*.tests.*", "conftest"]
ignore_errors = true

[[tool.mypy.overrides]]
# factory-boy's public API (Sequence, SubFactory, django.ImageField, ...) is
# untyped, so strict mode reports every call site as "untyped call in typed
# context" — noise, not a real bug source. Same reasoning as the tests
# override above; factories still run under the real test suite.
module = "*.factories"
ignore_errors = true

[[tool.mypy.overrides]]
module = ["factory.*", "storages.*", "environ.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "--reuse-db"
norecursedirs = [".venv", "tools", "static", "node_modules", "migrations"]

[tool.coverage.run]
branch = true
omit = [
    "*/migrations/*",
    "manage.py",
    "config/*",
    "*/tests/*",
    "*/test_*.py",
    "*/factories.py",
    ".venv/*",
    "tools/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
