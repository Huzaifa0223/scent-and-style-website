name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DJANGO_SETTINGS_MODULE: config.settings.test
  # CI-only placeholder — never reused anywhere real. Long/random enough that
  # `check --deploy` doesn't flag it, which is the point: this workflow is
  # meant to run the same "clean" bill of health as a real deploy would.
  SECRET_KEY: github-actions-ci-only-secret-do-not-reuse-8f3a1c9d7e5b2f60
  DEBUG: "False"
  ALLOWED_HOSTS: testserver
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/ecommerce

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements/dev.txt

      - name: Install dependencies
        run: pip install -r requirements/dev.txt

      - name: Vendor HTMX / Alpine / SortableJS (not CDN-loaded — see roadmap Stage 1/3)
        run: |
          mkdir -p static/vendor
          curl -sL -o static/vendor/htmx.min.js https://unpkg.com/htmx.org@2.0.10/dist/htmx.min.js
          curl -sL -o static/vendor/alpine.min.js https://unpkg.com/alpinejs@3.14.9/dist/cdn.min.js
          curl -sL -o static/vendor/sortable.min.js https://unpkg.com/sortablejs@1.15.6/Sortable.min.js

      - name: Build Tailwind CSS (standalone CLI — no Node)
        run: |
          mkdir -p tools
          curl -sL -o tools/tailwindcss https://github.com/tailwindlabs/tailwindcss/releases/download/v3.4.19/tailwindcss-linux-x64
          chmod +x tools/tailwindcss
          ./tools/tailwindcss -c tailwind.config.js -i static/css/input.css -o static/css/app.css --minify

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

      - name: mypy --strict
        run: mypy .

      - name: makemigrations --check --dry-run
        run: python manage.py makemigrations --check --dry-run

      - name: pytest --cov
        run: |
          pytest --cov --cov-report=term-missing
          coverage report --include="core/*" --fail-under=80
          coverage report --include="store/*" --fail-under=80
          coverage report --include="catalog/*" --fail-under=85
          coverage report --include="accounts/*" --fail-under=80
          coverage report --include="portal/*" --fail-under=80
          coverage report --include="inventory/*" --fail-under=90
          coverage report --include="search/*" --fail-under=90

      - name: manage.py check --deploy (production settings)
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          ALLOWED_HOSTS: example.com
          AWS_ACCESS_KEY_ID: dummy
          AWS_SECRET_ACCESS_KEY: dummy
          AWS_STORAGE_BUCKET_NAME: dummy-bucket
          AWS_S3_ENDPOINT_URL: https://example.r2.cloudflarestorage.com
        run: python manage.py check --deploy
